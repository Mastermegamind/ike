# Serves the one-line installer at https://ike.megamindtechnologies.com/installer.sh
#
# Option A (recommended): redirect to the copy attached to the latest GitHub
# release, so the domain never serves a stale script. curl -L follows it.
#
# Install: copy to /etc/nginx/conf.d/, point DNS at this server, then run
#   certbot --nginx -d ike.megamindtechnologies.com
server {
    listen 80;
    listen [::]:80;
    server_name ike.megamindtechnologies.com;

    location = /installer.sh {
        return 302 https://github.com/Mastermegamind/ike/releases/latest/download/installer.sh;
    }

    # Option B: serve a file you upload yourself instead of redirecting.
    # Comment out the location above and uncomment this one.
    # location = /installer.sh {
    #     root /var/www/ike;
    #     default_type text/plain;
    #     charset utf-8;
    #     add_header Cache-Control "no-cache";
    #     add_header X-Content-Type-Options nosniff;
    # }

    location = / {
        return 302 https://github.com/Mastermegamind/ike;
    }
}
