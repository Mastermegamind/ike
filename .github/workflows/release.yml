name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the web panel
        working-directory: web
        run: npm ci && VITE_IKE_API=http npm run build && rm -rf ../agent/internal/panel/ui/dist && cp -r dist ../agent/internal/panel/ui/dist
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build binaries and checksums
        working-directory: agent
        run: |
          mkdir -p dist
          # Server binaries (the installer downloads these, ike included)
          for arch in amd64 arm64; do
            for bin in ike-agent ike-mcp ike-panel ike; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                -o dist/$bin-linux-$arch ./cmd/$bin
            done
          done
          # The CLI and MCP server for people's own computers
          for t in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            for bin in ike ike-mcp; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                -o dist/$bin-$os-$arch$ext ./cmd/$bin
            done
          done
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
      - name: Installer checksums
        run: |
          cp installer/install.sh installer/installer.sh agent/dist/
          (cd agent/dist && sha256sum install.sh > install.sh.sha256 && sha256sum installer.sh > installer.sh.sha256)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent/dist/* --generate-notes
